name: PDF metadata title cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch title regex
        run: python3 -c "from pathlib import Path; p=Path('src/app/books.js'); s=p.read_text(); old='/^(untitled|microsoft|document|doc[_ -]?\\\\d+|document[_ -]?\\\\d+|img[_ -]?\\\\d+|wa[_ -]?\\\\d+)$/i'; new='/^(untitled|microsoft|document|img|wa|doc(?:ument)?)(?:[ _-]*\\\\d+.*)?$/i'; assert s.count(old)==2, s.count(old); p.write_text(s.replace(old,new))"
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/books.js
          git commit -m "fix: reject generated PDF metadata titles"
          git rm .github/workflows/fix-pdf-title.yml
          git commit -m "chore: remove temporary title workflow"
          git push
