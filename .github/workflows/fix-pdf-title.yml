name: One-time PDF title patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch generic PDF metadata titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/books.js')
          text = path.read_text(encoding='utf-8')

          old = """      const genericPdfTitle =
        /^(untitled|microsoft|document|doc[_ -]?\\d+|document[_ -]?\\d+|img[_ -]?\\d+|wa[_ -]?\\d+)$/i
          .test(cleanMetaTitle);"""

          new = """      const genericPdfTitle =
        /^(untitled|microsoft|document|img|wa|doc(?:ument)?)(?:[ _-]*\\d+)?(?:[ _-]+wa\\d+)?(?:\\s*\\d+)?$/i.test(cleanMetaTitle) ||
        /^(doc(?:ument)?)[ _-]*\\d+.*$/i.test(cleanMetaTitle) ||
        /^(wa)[ _-]*\\d+.*$/i.test(cleanMetaTitle);"""

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 PDF title blocks, found {count}; refusing to modify.')

          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/books.js
          git commit -m "fix: reject generated PDF metadata titles"
          git rm .github/workflows/fix-pdf-title.yml
          git commit -m "chore: remove temporary PDF title workflow"
          git push origin HEAD:main
