name: Native PDF title fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch books.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/books.js')
          text = path.read_text(encoding='utf-8')

          old_sig = 'export async function addFile(file) {'
          new_sig = 'export async function addFile(file, options = {}) {'
          if text.count(old_sig) != 1:
              raise SystemExit(f'Expected one addFile signature, found {text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          marker = '    let chapters = [];\n'
          insertion = '''    let chapters = [];\n\n    const preferredTitle =\n      (options.preferredTitle || '')\n        .replace(/\\.[^.]+$/, '')\n        .trim();\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one chapters marker, found {text.count(marker)}')
          text = text.replace(marker, insertion, 1)

          old_title = '''      title =\n        cleanMetaTitle.length > 2 &&\n        !genericPdfTitle\n          ? cleanMetaTitle\n          : '';'''
          new_title = old_title + '''\n\n      if (preferredTitle.length > 2) {\n        title = preferredTitle;\n      }'''
          count = text.count(old_title)
          if count != 2:
              raise SystemExit(f'Expected 2 PDF metadata title blocks, found {count}')
          text = text.replace(old_title, new_title)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/books.js
          git commit -m "fix: preserve Android PDF filename"
          git rm .github/workflows/fix-native-pdf-title.yml
          git commit -m "chore: remove temporary native title workflow"
          git push origin HEAD:main
