name: Fix native PDF options

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix addFile options parameter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/books.js')
          text = path.read_text(encoding='utf-8')
          old = 'export async function addFile(file) {'
          new = 'export async function addFile(file, options = {}) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old signature, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/books.js
          git commit -m "fix: accept native import options"
          git rm .github/workflows/fix-options-undefined.yml
          git commit -m "chore: remove temporary options fix workflow"
          git push origin HEAD:main
